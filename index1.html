<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>无人机中继系统演示</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 与 Babel -->
    <script src="https://cdn.staticfile.net/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.staticfile.net/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.staticfile.net/babel-standalone/7.23.3/babel.min.js" crossorigin></script>
</head>
<body class="bg-slate-100 overflow-x-hidden">

    <!-- React 挂载的根节点 -->
    <div id="root"></div>

    <!-- 所有的 React 代码都直接写在下面这个标签内部 -->
    <script type="text/babel">
        // 1. 定义你的 React 组件
        function App() {
            return (
                <div class="p-6">
                    <h1 class="text-2xl font-bold text-slate-800">无人机通信中继演示系统</h1>
                    <p class="text-slate-600 mt-2">系统已成功启动！</p>
                </div>
            );
        }

        // 2. 渲染组件到根节点
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
