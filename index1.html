<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 极其重要：防止手机端微信扫码后，双击屏幕或缩放导致排版错乱 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数字化低空控制塔 - 动态重构仿真系统</title>
    
    <!-- 引入 Tailwind CSS 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 核心库与 DOM 库 (UMD 生产版本) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 引入 Babel 用于在浏览器中实时解析 JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js" crossorigin></script>
    
    <style>
        /* 针对移动端微信浏览器的丝滑滚动与防选中优化 */
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0b0f19;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-100 overflow-x-hidden">

    <!-- React 挂载根节点 -->
    <div id="root"></div>

    <!-- 将 React 逻辑直接内嵌，完美绕过浏览器的跨域(CORS)限制，确保 100% 部署成功 -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
          // 算法开启状态：true (开启不断链), false (关闭传统方案)
          const [algoEnabled, setAlgoEnabled] = useState(true);
          
          // 运载无人机 X 坐标 (0 到 100 循环)
          const [carrierX, setCarrierX] = useState(10);
          
          // 运行状态控制
          const [isPlaying, setIsPlaying] = useState(true);

          // 动画帧循环
          useEffect(() => {
            if (!isPlaying) return;
            const interval = setInterval(() => {
              setCarrierX((prev) => {
                if (prev >= 90) return 10; // 到达终点后折返
                return prev + 0.5;
              });
            }, 40);
            return () => clearInterval(interval);
          }, [isPlaying]);

          // 动态计算中继无人机的位置与状态
          // 盲区范围设在 X 坐标 43 到 77 之间
          const isInBlindArea = carrierX >= 43 && carrierX <= 77;
          
          // 中继无人机坐标计算
          let relayX = 30;
          let relayY = 40;
          let isRelayDeployed = false;

          if (algoEnabled) {
            if (carrierX < 40) {
              // 运载机未进入危险区，中继机在枢纽待命
              relayX = 30;
              relayY = 40;
              isRelayDeployed = false;
            } else if (carrierX >= 40 && carrierX <= 80) {
              // 运载机接近或在盲区，中继机前出至盲区边缘提供中继
              relayX = 50;
              relayY = 55;
              isRelayDeployed = true;
            } else {
              // 运载机离开，中继机返航
              relayX = 30;
              relayY = 40;
              isRelayDeployed = false;
            }
          } else {
            // 传统方案：中继机不响应，一直停在枢纽
            relayX = 30;
            relayY = 40;
            isRelayDeployed = false;
          }

          // 计算当前通信链路状态
          const isConnected = !isInBlindArea || algoEnabled;

          // 模拟动态数据大屏
          const signalStrength = isConnected 
            ? (isInBlindArea ? "65% (中继桥接)" : "92% (直连基站)") 
            : "0% (链路中断)";
          
          const latency = isConnected 
            ? (isInBlindArea ? "45 ms" : "12 ms") 
            : "-- ms";

          const successRate = algoEnabled ? "99.4%" : "78.2%";

          return (
            <div className="min-h-screen bg-[#0b0f19] flex flex-col text-slate-100">
              
              <!-- 顶部科技感导航栏 -->
              <header className="border-b border-slate-800 bg-[#0f172a] px-4 py-3 flex items-center justify-between shadow-lg">
                <div className="flex items-center space-x-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                  <h1 className="text-base md:text-lg font-bold tracking-wider text-emerald-400">通感智航控制塔</h1>
                </div>
                <span className="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-400 border border-slate-700">
                  Demo V1.0
                </span>
              </header>

              <!-- 主体内容：自适应布局（手机端上下堆叠，电脑端左右并排） -->
              <main className="flex-1 flex flex-col lg:flex-row p-4 gap-4 max-w-7xl mx-auto w-full">
                
                <!-- 左侧：控制台与态势图 -->
                <div className="flex-1 flex flex-col gap-4">
                  
                  <!-- 1. 核心仿真可视化画布 -->
                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-3 shadow-xl relative overflow-hidden">
                    <div className="absolute top-3 left-3 z-10 bg-slate-900/80 backdrop-blur px-2 py-1 rounded text-[10px] text-slate-400 border border-slate-800">
                      实时低空态势仿真
                    </div>
                    
                    <!-- 仿真 SVG 画布 -->
                    <svg viewBox="0 0 400 200" className="w-full h-auto bg-[#070a13] rounded-lg border border-slate-900">
                      <!-- 背景网格线 -->
                      <defs>
                        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" strokeWidth="0.5" />
                        </pattern>
                      </defs>
                      <rect width="100%" height="100%" fill="url(#grid)" />

                      <!-- 信号基站 (枢纽中心) -->
                      <g transform="translate(40, 140)">
                        <line x1="0" y1="0" x2="0" y2="-40" stroke="#475569" strokeWidth="3" />
                        <polygon points="0,-45 -10,-25 10,-25" fill="#64748b" />
                        <circle cx="0" cy="-45" r="5" fill="#3b82f6" className="animate-pulse" />
                        <!-- 基站发射波纹 -->
                        <circle cx="0" cy="-45" r="15" fill="none" stroke="#3b82f6" strokeWidth="1" opacity="0.3" className="animate-ping" style={{ animationDuration: '3s' }} />
                        <text x="0" y="15" fill="#94a3b8" fontSize="8" textAnchor="middle">控制枢纽</text>
                      </g>

                      <!-- 信号盲区 (红色高楼遮挡区) -->
                      <g transform="translate(200, 100)">
                        <!-- 红色半透明遮挡盲区 -->
                        <rect x="-40" y="0" width="80" height="100" fill="#ef4444" opacity="0.15" />
                        <line x1="-40" y1="0" x2="-40" y2="100" stroke="#ef4444" strokeDasharray="2,2" opacity="0.5" />
                        <line x1="40" y1="0" x2="40" y2="100" stroke="#ef4444" strokeDasharray="2,2" opacity="0.5" />
                        <!-- 高楼剪影 -->
                        <rect x="-25" y="20" width="50" height="80" fill="#1e293b" stroke="#334155" strokeWidth="1" />
                        <rect x="-15" y="40" width="10" height="15" fill="#475569" />
                        <rect x="5" y="40" width="10" height="15" fill="#475569" />
                        <rect x="-15" y="65" width="10" height="15" fill="#475569" />
                        <rect x="5" y="65" width="10" height="15" fill="#475569" />
                        <text x="0" y="15" fill="#f87171" fontSize="8" textAnchor="middle" fontWeight="bold">信号盲区 (高楼遮挡)</text>
                      </g>

                      <!-- 链路连线 -->
                      {/* 基站到中继机链路 */}
                      {isRelayDeployed && (
                        <line x1="40" y1="95" x2={relayX * 4} y2={200 - (relayY * 2)} stroke="#10b981" strokeWidth="1.5" strokeDasharray="3,3" />
                      )}
                      
                      {/* 中继机到运载机链路 */}
                      {isRelayDeployed && isInBlindArea && (
                        <line x1={relayX * 4} y1={200 - (relayY * 2)} x2={carrierX * 4} y2="60" stroke="#10b981" strokeWidth="2" strokeDasharray="4,2" className="animate-pulse" />
                      )}

                      {/* 基站到运载机直连链路 */}
                      {!isInBlindArea && (
                        <line x1="40" y1="95" x2={carrierX * 4} y2="60" stroke="#3b82f6" strokeWidth="1.5" />
                      )}

                      {/* 传统方案下的断链红线 */}
                      {isInBlindArea && !algoEnabled && (
                        <line x1="40" y1="95" x2={carrierX * 4} y2="60" stroke="#ef4444" strokeWidth="1.5" strokeDasharray="2,4" />
                      )}

                      <!-- 中继无人机 (绿色) -->
                      <g transform={`translate(${relayX * 4}, ${200 - (relayY * 2)})`}>
                        <circle cx="0" cy="0" r="8" fill={isRelayDeployed ? "#10b981" : "#64748b"} opacity="0.2" className={isRelayDeployed ? "animate-ping" : ""} />
                        <circle cx="0" cy="0" r="4" fill={isRelayDeployed ? "#10b981" : "#64748b"} />
                        <line x1="-8" y1="0" x2="8" y2="0" stroke={isRelayDeployed ? "#10b981" : "#64748b"} strokeWidth="1" />
                        <line x1="0" y1="-8" x2="0" y2="8" stroke={isRelayDeployed ? "#10b981" : "#64748b"} strokeWidth="1" />
                        <text x="0" y="-12" fill={isRelayDeployed ? "#34d399" : "#94a3b8"} fontSize="7" textAnchor="middle" fontWeight="bold">
                          {isRelayDeployed ? "中继机 (已部署)" : "中继机 (待命)"}
                        </text>
                      </g>

                      <!-- 运载无人机 (橙色/红色) -->
                      <g transform={`translate(${carrierX * 4}, 60)`}>
                        <circle cx="0" cy="0" r="10" fill={isConnected ? "#f97316" : "#ef4444"} opacity="0.2" className={!isConnected ? "animate-ping" : ""} />
                        <circle cx="0" cy="0" r="5" fill={isConnected ? "#f97316" : "#ef4444"} />
                        <line x1="-10" y1="-3" x2="10" y2="3" stroke={isConnected ? "#f97316" : "#ef4444"} strokeWidth="1" />
                        <line x1="-10" y1="3" x2="10" y2="-3" stroke={isConnected ? "#f97316" : "#ef4444"} strokeWidth="1" />
                        <text x="0" y="-12" fill={isConnected ? "#ffedd5" : "#fca5a5"} fontSize="8" textAnchor="middle" fontWeight="bold">
                          {isConnected ? "运载机" : "运载机 (断链失控!)"}
                        </text>
                      </g>

                      <!-- 航线虚线 -->
                      <line x1="40" y1="60" x2="360" y2="60" stroke="#475569" strokeWidth="1" strokeDasharray="4,4" opacity="0.3" />
                    </svg>
                  </div>

                  <!-- 2. 交互控制面板 -->
                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-4 shadow-xl">
                    <h3 className="text-sm font-semibold text-slate-300 mb-3 flex items-center">
                      <span className="w-1.5 h-3 bg-emerald-500 rounded-full mr-2"></span>
                      算法重构交互控制台
                    </h3>
                    
                    <div className="grid grid-cols-2 gap-3">
                      <!-- 算法开关按钮 -->
                      <button 
                        onClick={() => setAlgoEnabled(!algoEnabled)}
                        className={`p-3 rounded-lg border transition-all duration-200 flex flex-col items-center justify-center text-center ${
                          algoEnabled 
                            ? "bg-emerald-950/40 border-emerald-500 text-emerald-400 shadow-lg shadow-emerald-950/20" 
                            : "bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700"
                        }`}
                      >
                        <span className="text-xs font-medium">通感智航算法</span>
                        <span className="text-lg font-bold mt-1">{algoEnabled ? "已开启 (不断链)" : "已关闭 (传统)"}</span>
                      </button>

                      <!-- 暂停/继续动画按钮 -->
                      <button 
                        onClick={() => setIsPlaying(!isPlaying)}
                        className={`p-3 rounded-lg border transition-all duration-200 flex flex-col items-center justify-center text-center ${
                          isPlaying 
                            ? "bg-blue-950/40 border-blue-500 text-blue-400" 
                            : "bg-slate-900 border-slate-800 text-slate-400"
                        }`}
                      >
                        <span className="text-xs font-medium">仿真运行状态</span>
                        <span className="text-lg font-bold mt-1">{isPlaying ? "正在运行" : "已暂停"}</span>
                      </button>
                    </div>

                    <!-- 提示 -->
                    <p className="text-[11px] text-slate-500 mt-3 text-center">
                      💡 提示：点击上方按钮，对比开启算法前后运载机进入盲区时的通信表现。
                    </p>
                  </div>

                </div>

                <!-- 右侧：数据监控大屏 -->
                <div className="w-full lg:w-80 flex flex-col gap-4">
                  
                  <!-- 实时遥测指标 -->
                  <div className="bg-[#0f172a] border border-slate-800 rounded-xl p-4 shadow-xl flex-1">
                    <h3 className="text-sm font-semibold text-slate-300 mb-4 flex items-center">
                      <span className="w-1.5 h-3 bg-blue-500 rounded-full mr-2"></span>
                      实时数据监控大屏
                    </h3>

                    <div className="space-y-4">
                      <!-- 指标 1：链路连通状态 -->
                      <div className="bg-slate-900/60 p-3 rounded-lg border border-slate-800/80">
                        <div className="text-xs text-slate-400 mb-1">当前通信链路状态</div>
                        <div className="flex items-center justify-between">
                          <span className={`text-base font-bold ${isConnected ? "text-emerald-400" : "text-rose-500 animate-pulse"}`}>
                            {isConnected ? "CONNECTED (正常)" : "DISCONNECTED (断链)"}
                          </span>
                          <span className={`w-2.5 h-2.5 rounded-full ${isConnected ? "bg-emerald-500" : "bg-rose-500 animate-ping"}`}></span>
                        </div>
                      </div>

                      <!-- 指标 2：信号强度 -->
                      <div className="bg-slate-900/60 p-3 rounded-lg border border-slate-800/80">
                        <div className="text-xs text-slate-400 mb-1">接收端信号强度 (RSSI)</div>
                        <div className="text-lg font-bold text-slate-200">{signalStrength}</div>
                      </div>

                      <!-- 指标 3：双向传输时延 -->
                      <div className="bg-slate-900/60 p-3 rounded-lg border border-slate-800/80">
                        <div className="text-xs text-slate-400 mb-1">通信时延 (Latency)</div>
                        <div className="text-lg font-bold text-slate-200">{latency}</div>
                      </div>

                      <!-- 指标 4：核心算法对比 -->
                      <div className="bg-slate-900/60 p-3 rounded-lg border border-slate-800/80">
                        <div className="text-xs text-slate-400 mb-1">方案综合连通率对比</div>
                        <div className="flex items-end justify-between mt-1">
                          <div>
                            <span className="text-2xl font-black text-emerald-400">{successRate}</span>
                            <span className="text-[10px] text-slate-500 block">当前方案连通率</span>
                          </div>
                          <div className="text-right text-[10px] text-slate-400">
                            <div>通感重构方案: <span className="text-emerald-400 font-bold">99.4%</span></div>
                            <div>传统无中继方案: <span class="text-rose-400 font-bold">78.2%</span></div>
                          </div>
                        </div>
                      </div>

                    </div>
                  </div>

                  <!-- 备赛答辩核心亮点包装 -->
                  <div className="bg-gradient-to-br from-slate-900 to-[#0f172a] border border-emerald-950 rounded-xl p-4 shadow-xl">
                    <h4 className="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">💡 答辩核心卖点支撑</h4>
                    <ul className="text-[11px] text-slate-400 space-y-1.5 list-disc pl-4">
                      <li><b>动态感知</b>：控制塔实时解算运载机轨迹，提前 3 秒预测信号盲区。</li>
                      <li><b>重构链路</b>：中继机响应调度，以毫秒级时延重建中继信道。</li>
                      <li><b>学术闭环</b>：用 10% 的合理能耗微增，换取了 21.2% 的通信连通率绝对提升。</li>
                    </ul>
                  </div>

                </div>

              </main>

              <!-- 底部版权 -->
              <footer className="py-3 text-center text-[10px] text-slate-600 border-t border-slate-900 bg-[#070a13] mt-auto">
                © 2026 低空通感智航项目组 · 数字化控制塔仿真系统
              </footer>

            </div>
          );
        }

        // 渲染 React 组件到页面上
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>
</html>
